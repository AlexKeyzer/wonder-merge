    if(!opt.free&&freeLeft>0){
      var a2=document.createElement('button');

      res.innerHTML=(roll.ci>=0
        ? '<div class="hero"><div class="art" style="width:104px;animation:heroIn .6s cubic-bezier(.34,1.56,.64,1) both">'+I.creatureSVG(roll.ci)+'</div>'
          +'<div class="m-title" style="font-size:16px">'+cname+'</div>'+UI.rarityChip(roll.rar)+'</div>'
        : '')
        +UI.rewards([{type:'dew',n:roll.dew},{type:'seed',n:roll.seeds}]);
      AUDIO.sfx(roll.rar>=3?'legend':'revive');
      rebuild();
      if(roll.rar>=2&&roll.ci>=0){
        UI.banner({kicker:window.t('revived'),title:cname,desc:'+'+CR[roll.ci].inc+' 💧/'+(window.LANG==='ru'?'час':'h')+' · '+window.t('rarity'+roll.rar),
          art:I.creatureSVG(roll.ci),legend:roll.rar===3,ms:3000});
        if(roll.rar===3) setTimeout(function(){ shareLegendaryPrompt(roll.ci); },2600);
      }
      UI.topbar(); UI.dockBadges();
    },420);
  }
  rebuild();
  if(opt.auto) setTimeout(function(){ doOpen(true); },260);
};

/* ===== 70_tutorial.js ===== */
/* =====================================================================
   70_tutorial.js — onboarding v2:
   · пошаговый интерактивный туториал (прожектор на реальном UI, прогресс
     по событиям игры, скип, возобновление, nudges)
   · справочник «Как играть» (12 разделов, пейджинг без скроллбаров)
   · чип текущей цели на поле слияния
   Сейв-поле: S.flags.tut (0=новый, 1..N=шаг, 99=прошёл/пропустил/ветеран)
   ===================================================================== */
(function(){
"use strict";
var D=window.DATA, I=window.ICONS;
var TUT={}; window.TUT=TUT;

/* ---------------- steps ---------------- */
TUT.steps=[
 {t:'tut1t', b:'tut1b', target:null,                                            wait:'next'},
 {t:'tut2t', b:'tut2b', target:'#board',                                        wait:'merge', setup:ensureTrio},
 {t:'tut3t', b:'tut3b', target:'#gens',                                         wait:'gen'},
 {t:'tut4t', b:'tut4b', target:'#chipDew',                                      wait:'next'},
 {t:'tut5t', b:'tut5b', target:'#dock .dbtn[data-id="forest"]',                 wait:'next'},
 {t:'tut6t', b:'tut6b', target:'#dock .dbtn[data-id="more"]',                   wait:'next'},
 {t:'tut7t', b:'tut7b', target:null,                                            wait:'next', last:true}
];
TUT.active=function(){ var t=G.S().flags.tut; return t>0&&t<99; };
TUT.step=function(){ return G.S().flags.tut; };

function ensureTrio(){
  var S=G.S(), found=null, m={};
  G.forEachItem(function(c,i){ (m[c.l+'_'+c.k]=m[c.l+'_'+c.k]||[]).push(i); });
  for(var k in m){ if(m[k].length>=3){ found=m[k]; break; } }
  if(found){ pulseCells(found.slice(0,3)); return; }
  /* guarantee: plant three seeds of the flowers line */
  var cells=[];
  for(var i=0;i<3;i++){ var f=G.freeCell(); if(f==null) break; G.spawn(f,0,1,false); cells.push(f); }
  pulseCells(cells);
}
function pulseCells(list){
  list.forEach(function(i){
    var el=document.querySelectorAll('#board .cell')[i];
    if(el){ el.classList.add('hint'); setTimeout(function(){ el.classList.remove('hint'); },6000); }
  });
}

/* ---------------- overlay ---------------- */
var layer=null, nudgeTimer=null;
function kill(){ if(layer){ layer.remove(); layer=null; } clearInterval(nudgeTimer); }
TUT.hide=kill;

function show(){
  if(!TUT.active()) return;
  kill();
  var idx=TUT.step()-1, st=TUT.steps[idx];
  if(!st){ finish(); return; }
  if(st.setup) setTimeout(st.setup,250);
  layer=document.createElement('div');
  layer.id='coach';
  layer.innerHTML='<div class="coach-ring" id="coachRing"></div>'
    +'<div class="coachcard" id="coachCard">'
    +'<div class="cc-step">'+(window.LANG==='ru'?'Шаг':'Step')+' '+(idx+1)+' / '+TUT.steps.length+'</div>'
    +'<div class="cc-title">'+window.t(st.t)+'</div>'
    +'<div class="cc-body">'+U.rich(window.t(st.b))+'</div>'
    +'<div class="cc-dots">'+TUT.steps.map(function(_,i){ return '<i class="'+(i<=idx?'on':'')+'"></i>'; }).join('')+'</div>'
    +'<div class="cc-acts">'
    +(st.wait==='next'?'<button class="pill gold sm" id="ccNext">'+(st.last?window.t('tut_done'):window.t('tut_next'))+'</button>'
                      :'<div class="cc-wait">'+(window.LANG==='ru'?'Выполни действие на экране':'Do the action on screen')+'</div>')
    +'<button class="pill ghost sm" id="ccSkip">'+window.t('tut_skip')+'</button>'
    +'</div></div>';
  document.body.appendChild(layer);
  place(st);
  var nb=layer.querySelector('#ccNext');
  if(nb) nb.addEventListener('click',function(){ AUDIO.sfx('tap'); advance(); });
  layer.querySelector('#ccSkip').addEventListener('click',function(){ AUDIO.sfx('tap'); TUT.skip(); });
  /* nudges: if an action-step stalls, remind the player */
  clearInterval(nudgeTimer);
  if(st.wait!=='next'){
    nudgeTimer=setInterval(function(){
      if(!TUT.active()) { clearInterval(nudgeTimer); return; }
      if(st.wait==='merge') UI.toastOnce('tutnudge',window.t('need3'),2000,9000);
      if(st.wait==='gen')   UI.toastOnce('tutnudge',window.t('tap_gen'),2000,9000);
      if(st.setup) st.setup();
    },12000);
  }
}
function place(st){
  if(!layer) return;
  var ring=layer.querySelector('#coachRing'), card=layer.querySelector('#coachCard');
  var el=st.target?document.querySelector(st.target):null;
  if(el){
    var r=el.getBoundingClientRect();
    ring.style.display='block';
    ring.style.left=(r.left-6)+'px'; ring.style.top=(r.top-6)+'px';
    ring.style.width=(r.width+12)+'px'; ring.style.height=(r.height+12)+'px';
    var below=r.bottom+170<window.innerHeight;
    card.style.left='50%'; card.style.transform='translateX(-50%)';
    card.style.top=(below?Math.min(window.innerHeight-260,r.bottom+18):Math.max(14,r.top-18-236))+'px';
  } else {
    ring.style.display='none';
    card.style.left='50%'; card.style.transform='translateX(-50%)';
    card.style.top='50%'; card.style.marginTop='-130px';
  }
}
window.addEventListener('resize',function(){ if(layer&&TUT.active()) place(TUT.steps[TUT.step()-1]); });

function advance(){
  var S=G.S();
  S.flags.tut=(S.flags.tut||0)+1;
  G.save();
  if(S.flags.tut>TUT.steps.length) finish(); else show();
}
function finish(){
  kill();
  var S=G.S();
  S.flags.tut=99; G.save();
  AUDIO.sfx('achv');
  FX.confetti(window.innerWidth/2,window.innerHeight*.4,44);
  UI.banner({kicker:window.LANG==='ru'?'Обучение завершено':'Tutorial complete',
    title:window.LANG==='ru'?'Лес в твоих руках!':'The forest is yours!',
    desc:window.LANG==='ru'?'Справка — в меню «Ещё» и в настройках':'Help lives in “More” and Settings',
    art:I.img('hlp',I.quest()),ms:2600});
  Game.emit('tutdone',{});
}
TUT.finish=finish; TUT.skip=function(){ kill(); G.S().flags.tut=99; G.save(); Game.emit('tutdone',{}); };
TUT.start=function(){ G.S().flags.tut=1; G.save(); UI.closeMenu(); UI.go('merge',{force:1}); setTimeout(show,500); };
TUT.resume=function(){ if(TUT.active()) setTimeout(show,700); };

/* event-driven steps */
Game.on('merge',function(){ if(TUT.active()&&TUT.steps[TUT.step()-1]&&TUT.steps[TUT.step()-1].wait==='merge') setTimeout(advance,650); });
Game.on('genspend',function(){ if(TUT.active()&&TUT.steps[TUT.step()-1]&&TUT.steps[TUT.step()-1].wait==='gen') setTimeout(advance,650); });

/* ---------------- one-time per-screen intro cards ---------------- */
var SI={map:['si_map_t','si_map_b','zone'],forest:['si_forest_t','si_forest_b','forest'],creatures:['si_creatures_t','si_creatures_b','cr'],
        quests:['si_quests_t','si_quests_b','quest'],friends:['si_friends_t','si_friends_b','friends'],shop:['si_shop_t','si_shop_b','shop']};
TUT.screenIntro=function(name){
  var S=G.S(), def=SI[name];
  if(!def||!S.flags.started) return;
  S.flags.scr=S.flags.scr||{};
  if(S.flags.scr.all||S.flags.scr[name]) return;
  if(TUT.active()) return;                       /* never stack on the coach-mark tutorial */
  S.flags.scr[name]=1; G.save();
  var art={zone:function(){return I.img('si',I.zoneIcon(2));},forest:function(){return I.img('si',I.forest());},
           cr:function(){return I.creatureSVG(13);},quest:function(){return I.img('si',I.quest());},
           friends:function(){return I.img('si',I.friends());},shop:function(){return I.img('si',I.shop());}}[def[2]]();
  setTimeout(function(){
    UI.modal({title:window.t(def[0]),
      body:'<div class="helpart">'+art+'</div><div class="m-sub" style="margin:2px 0 0">'+U.rich(window.t(def[1]))+'</div>',
      actions:[{label:window.t('ok_gotit'),cls:'gold'}]});
  },420);
};

/* ---------------- help book (12 sections, no scrollbars) ---------------- */
var HELP=[
 ['h1t','h1b',function(){return I.img('h1',I.forest());}],
 ['h2t','h2b',function(){return I.itemSVG(0,2);}],
 ['h3t','h3b',function(){return I.img('h3',I.gen(0));}],
 ['h4t','h4b',function(){return I.img('h4',I.dew());}],
 ['h5t','h5b',function(){return I.creatureSVG(13);}],
 ['h6t','h6b',function(){return I.img('h6',I.zoneIcon(2));}],
 ['h7t','h7b',function(){return I.img('h7',I.quest());}],
 ['h8t','h8b',function(){return I.img('h8',I.chest(true));}],
 ['h9t','h9b',function(){return I.img('h9',I.friends());}],
 ['h10t','h10b',function(){return I.img('h10',I.ad());}],
 ['h11t','h11b',function(){return I.img('h11',I.clock());}],
 ['h12t','h12b',function(){return I.img('h12',I.merge());}]
];
TUT.help=function(page){
  var idx=Math.max(0,Math.min(HELP.length-1,page||0));
  var s=HELP[idx];
  var body='<div class="helpart">'+s[2]()+'</div>'
    +'<div class="m-title" style="font-size:16px">'+window.t(s[0])+'</div>'
    +'<div class="m-sub" style="margin:4px 0 0">'+U.rich(window.t(s[1]))+'</div>'
    +'<div class="dots" id="helpDots">'+HELP.map(function(_,i){ return '<i class="'+(i===idx?'on':'')+'" data-hp="'+i+'"></i>'; }).join('')+'</div>';
  var m=UI.modal({title:window.t('help_t')+' · '+(idx+1)+'/'+HELP.length, body:body, row:true,
    actions:[
      {label:'←',cls:'ghost',onClick:function(mm){ mm.close(); TUT.help(idx-1); }},
      {label:'→',cls:'gold',onClick:function(mm){ mm.close(); TUT.help(idx+1); }}
    ]});
  var x=m.el.querySelector('.xbtn'); if(x) x.style.display='';
  U.$$('[data-hp]',m.el).forEach(function(d){
    d.addEventListener('click',function(){ m.close(); TUT.help(+d.dataset.hp); });
  });
  /* hide arrows at the edges */
  var acts=m.el.querySelectorAll('.m-actions .pill');
  if(idx===0) acts[0].classList.add('dis');
  if(idx===HELP.length-1) acts[1].classList.add('dis');
};

/* ---------------- goal chip on the merge board ---------------- */
TUT.goal=function(){
  var S=G.S();
  if(TUT.active()) return {txt:window.t(TUT.steps[TUT.step()-1].t),go:null,raw:true};
  for(var i=0;i<D.QUESTS.length;i++){
    var q=D.QUESTS[i];
    if(S.questsDone.indexOf(q.id)>=0||!G.zoneUnlocked(q.zone)) continue;
    if(q.idx>0&&S.questsDone.indexOf('q'+q.zone+'_'+(q.idx-1))<0) continue;
    var prog=Math.min(q.n,Game.questProgress(q));
    return {txt:window.UI.qText(q)+' · '+prog+'/'+q.n, go:function(){ UI._qzone=q.zone; UI._qtab='story'; UI.go('quests',{force:1}); }};
  }
  return {txt:window.LANG==='ru'?'Все квесты выполнены!':'All quests done!', go:null};

  }catch(e){}
  return null;
}
/* precedence: explicit player choice → platform ?lang → VK → save → navigator → 'en' */
function detectLang(){
  try{
    var f=localStorage.getItem('wondermerge.lang.choice');
    if(f==='ru'||f==='en') return f;
  }catch(e){}
  var u=urlLang(); if(u) return u;

/* ------------------------------------------------------------------ */
/* 2. asset generation (all art is procedural — instant, zero payload)  */
/* ------------------------------------------------------------------ */
function buildAssets(onStep){
  var total=0, done=0;
  var jobs=[];
  for(var l=0;l<8;l++) for(var t=1;t<=10;t++) jobs.push(function(ll,tt){ return function(){ I.svgURI('it'+ll+'_'+tt,I.itemSVG(ll,tt)); }; }(l,t));
  for(var c=0;c<50;c++) jobs.push(function(cc){ return function(){ I.svgURI('cr'+cc,I.creatureSVG(cc)); }; }(c));
  for(var g=0;g<8;g++) jobs.push(function(gg){ return function(){ I.svgURI('gen'+gg,I.gen(gg)); I.svgURI('zonebg'+gg,I.zoneBG(gg)); I.svgURI('zi'+gg,I.zoneIcon(gg)); }; }(g));
  ['dew','energy','seed','star0','star1','chest0','chest1','merge','map','forest','friends','paw','more','gear','shop','clock','lock','ad','play','trophy','hard','fair','gift','back','boss','quest'].forEach(function(k,i2){
    jobs.push(function(){
      var fn=k==='star0'?function(){return I.star(false);}:k==='star1'?function(){return I.star(true);}:
             k==='chest0'?function(){return I.chest(false);}:k==='chest1'?function(){return I.chest(true);}:I[k];
      I.svgURI(k,fn());
    });
  });
  total=jobs.length;
  var i=0;
  function chunk(){
    var t0=Date.now();
    while(i<jobs.length&&Date.now()-t0<11){
      try{ jobs[i](); }catch(e){ console.warn('asset',i,e); }
      i++; done=i;
    }
    onStep(done/total, i>=total);
    if(i<jobs.length) setTimeout(chunk,16);
  }
  chunk();
}

function loop(){
  var now=Date.now(), dt=Math.min(60000,now-lastTick); lastTick=now;
  if(!UI.isPaused()){
    G.tick(dt);
    if(UI.cur==='merge') { /* energy chip refresh */ }
    if(now-(loop._lastTop||0)>1000){ loop._lastTop=now; UI.topbar(); }
    if(now-(loop._lastSave||0)>10000){ loop._lastSave=now; G.save(); }
  }
}
setInterval(loop,1000);

  if(document.hidden){
    hiddenAt=Date.now();

  }
  else {
    lastTick=Date.now();
    var away=Date.now()-hiddenAt;
    if(!pauseOpen){
      /* auto-pause when the player was away (VK spec) */
      if(away>20000&&G.S().flags.started) UI.pause();
      var rep=G.offlineReport();
      if(away>180000&&rep.dew>0) UI.offlineModal(rep);
      if(!pauseOpen){ AUDIO.unlock(); if(UI.GAMEPLAY[UI.cur]) VK.gameplayStart(); }
    }
  }
});

/* ------------------------------------------------------------------ */
/* 7. boot                                                             */
/* ------------------------------------------------------------------ */
function boot(){
  window.LANG=detectLang();
  window.LANGDICT=window.I18N[window.LANG]||window.I18N.en;
  document.documentElement.lang=window.LANG;
  document.title=window.t('app_name');

  function start(){
    var S=G.S();
    /* never let an old save override the platform language */
    if(S.lang&&S.lang!==window.LANG){ S.lang=window.LANG; S.settings.lang=window.LANG; }
    window.LANGDICT=window.I18N[window.LANG]||window.I18N.en;
    document.documentElement.lang=window.LANG;
    document.title=window.t('app_name');
    /* audio prefs */
    AUDIO.muted=!!S.settings.muted; AUDIO.musVol=S.settings.musVol; AUDIO.sfxVol=S.settings.sfxVol;
    /* daily roll + streak */
    G.rollDaily();
    /* launch params (1.2.2): bind the save to the platform user id when present */
    var lp=VK.launch();
    if(lp&&lp.vk_user_id){ S.social=S.social||{}; S.social.vkId=String(lp.vk_user_id); }
    /* session metrics funnel */
    var MT=S.mt=S.mt||{sessions:0,ads:0,mergesS:0,days:{}}; MT.days=MT.days||{};
    MT.sessions=(MT.sessions||0)+1; MT.mergesS=0; MT.days[U.dayKey()]=1; G.save();
    /* UI */
    UI.buildDock();
    document.getElementById('btnSound').addEventListener('click',function(){
      AUDIO.unlock();
      S.settings.muted=!S.settings.muted; AUDIO.setMuted(S.settings.muted); G.save(); UI.topbar();
    });
    document.getElementById('btnMore').addEventListener('click',function(){ AUDIO.unlock(); UI.moreModal(); });
    document.getElementById('chipDew').addEventListener('click',function(){ AUDIO.unlock(); window.TUT.help(3); });
    document.getElementById('chipEnergy').addEventListener('click',function(){ AUDIO.unlock(); UI.energyModal(); });
    document.getElementById('lvlChip').addEventListener('click',function(){ AUDIO.unlock(); UI.go('achv'); });
    UI.go('merge');
    if(!S.flags.consent){ UI.consentGate(); }
    else if(!S.flags.started) UI.menu(); else { VK.gameplayStart(); AUDIO.playMusic(S.curZone); window.TUT.resume(); }
    /* VK lifecycle */
    VK.gameReady(); VK.gameStart();
    /* offline report */
    var rep=G.offlineReport();
    if(rep.ms>90000&&(rep.dew>0||rep.energy>0)){
      setTimeout(function(){ UI.offlineModal(rep); },900);
    }
    /* cloud save merge */
    VK.loadCloud().then(function(cs){
      if(cs&&cs.lastSave&&(!S.lastSave||cs.lastSave>S.lastSave+2000)&&cs.stats&&(cs.stats.merges||0)>=(S.stats.merges||0)){
        /* cloud is newer → adopt it */
        try{
          localStorage.setItem('wondermerge.save.v1',JSON.stringify(cs));
          UI.modal({title:'☁️ '+window.t('cloud'),sub:window.LANG==='ru'?'Найден более свежий облачный сейв':'A newer cloud save was found',
            body:'<div class="kv"><span>'+window.t('stat_merges')+'</span><b>'+(cs.stats.merges||0)+'</b></div>'
              +'<div class="kv"><span>'+window.t('creatures')+'</span><b>'+((cs.creatures||[]).length)+'</b></div>'
              +'<div class="kv"><span>'+window.t('zone')+'</span><b>'+((cs.zones||[]).length)+'</b></div>',
            actions:[{label:window.LANG==='ru'?'Загрузить облако':'Load cloud',cls:'gold',onClick:function(m){
              location.reload();
            }},{label:window.t('cancel'),cls:'ghost',onClick:function(m){ m.close(); G.save(true); }}]});
        }catch(e){}
      }
    });
    /* V6: client never submits to the native leaderboard — honest in-game list + share hooks only.
       (VK.setScore stays available for a server-side submit if/when a backend appears.) */
    /* bridge events */
    VK.onEvent(function(type,data){
      if(type==='VKWebAppViewHide'){ G.save(true); AUDIO.suspendNow(); UI.pause(); }
      if(type==='VKWebAppViewRestore'){ lastTick=Date.now(); if(!pauseOpen) AUDIO.unlock(); }
      if(/Pause|pause/.test(type)) UI.pause();
      if(/Resume|resume/.test(type)) { /* resume handled by modal */ }
      if(type==='VKWebAppAudioMuteChanged'||type==='VKWebAppAudioMuteStateChanged'){
        var muted=!!(data&&data.mute);
        G.S().settings.muted=muted; AUDIO.setMuted(muted); UI.topbar();
      }
    });
    /* first-gesture audio unlock (mobile autoplay policies) */
    ['pointerdown','touchstart','keydown'].forEach(function(ev){
      window.addEventListener(ev,function once(){ AUDIO.unlock(); if(UI.GAMEPLAY[UI.cur]) AUDIO.playMusic(G.S().curZone);
        window.removeEventListener(ev,once); },{once:true,passive:true});
    });
    window.addEventListener('blur',function(){ G.save(true); });
    /* expose for QA + promo capture */
    window.__WM={Game:Game,STATE:G,UI:UI,DATA:D,VK:VK,AUDIO:AUDIO,ICONS:I,FX:FX,
      ui:function(name){ UI.closeMenu(); UI.go(name,{force:1}); },
      dev:Game.devPanel||UI.devPanel};
  }

  /* load state (local first; cloud handled inside start) */
  G.load(window.LANG);
  if(firstVisit()) runPreloader(start);
  else skipPreloader(start);
}

/* VKWebAppInit must be the very first bridge call.
   The bridge script is async: wait up to 2s for it (fast inside VK webview),
   then initialise or fall back — never block the game on the CDN. */
var booted=false;
function safeBoot(){ if(booted) return; booted=true; boot(); }
function waitBridge(ms){
  return new Promise(function(res){
    var t0=Date.now();
    (function poll(){
      if(window.__vkBridgeBlocked) return res(false);
      var b=window.vkBridge||window.VKBridge;
      if(b&&b.send) return res(true);
      if(Date.now()-t0>ms) return res(false);
      setTimeout(poll,60);
    })();
  });
}
waitBridge(2000).then(function(){ return window.VK.init(); }).then(safeBoot).catch(safeBoot);
setTimeout(safeBoot,4000);   /* hard fallback: never hang on the SDK */
})();
